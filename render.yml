# render.yaml
services:
  # Service for the API Gateway
  - type: web
    name: iparty-gateway
    runtime: docker
    repo: https://github.com/YonyUk/iParty-backend.git
    dockerfilePath: ./API_Gateaway/Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ReverseProxy__Clusters__users-cluster__Destinations__users-dest__Address
        value: http://iparty-users-api:8080
      - key: Security__Jwt__SecretKey
        generateValue: true # autogenerated value
      - key: Security__Jwt__Issuer
        value: users-service
      - key: Security__Jwt__Audience
        value: iparty-frontend
    healthCheckPath: /info

  # Service for Users API (Private)
  - type: web
    name: iparty-users-api
    runtime: docker
    repo: https://github.com/YonyUk/iParty-backend.git
    dockerfilePath: ./Services/Users/API/Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value:  Host={{ postgres.host }};Port={{ postgres.port }};Database={{ postgres.database }};Username={{ postgres.user }};Password={{ postgres.password }};SSL Mode=Require;Trust Server Certificate=true;
      - key: Jwt__SecretKey
        fromService:
          name: iparty-gateway
          type: web
          envVarKey: Security__Jwt__SecretKey
      - key: Jwt__Issuer
        value: users-service
      - key: Jwt__Audience
        value: iparty-frontend

databases:
  - name: users_db
    plan: free